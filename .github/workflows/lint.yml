name: CI (Python)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pylint pytest
          pip install -r requirements.txt
      - name: Run Pylint
        run: pylint library_app/ --fail-under=7.0

      - name: Run tests
        run: python -m pytest --tb=short
